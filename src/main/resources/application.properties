# ================================
# ? CONFIGURAÇÕES GERAIS DO SPRING BOOT
# ================================

# Nome da aplicação (usado em logs, monitoramento, etc.)
spring.application.name=TechInner


# ================================
# ?? CONFIGURAÇÃO DO BANCO DE DADOS (SQL SERVER)
# ================================

# URL completa de conexão com o banco hospedado no Somee
# Inclui servidor, porta, nome do banco e credenciais de acesso
spring.datasource.url=jdbc:sqlserver://DB-OrderTech.mssql.somee.com:1433;databaseName=DB-OrderTech;TrustServerCertificate=True
spring.datasource.username=felipe
# Driver JDBC usado para conectar ao SQL Server
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialeto do Hibernate ? adapta as queries para o SQL Server 2012+
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect


# ================================
# ? CONFIGURAÇÃO DO HIBERNATE / JPA
# ================================

# Define o comportamento do Hibernate com o banco:
# - create: recria o banco a cada execução (apaga dados)
# - update: atualiza o banco sem apagar dados (ideal em desenvolvimento)
# - validate: só verifica se o modelo está correto
# - none: não faz nenhuma alteração
spring.jpa.hibernate.ddl-auto=update

# Exibe as queries SQL geradas pelo Hibernate no console
spring.jpa.show-sql=true

# Formata as queries para ficarem legíveis no console
spring.jpa.properties.hibernate.format_sql=true


# ================================
# ? LOGS DO SPRING
# ================================

# Define o nível de detalhes exibido nos logs:
# (TRACE < DEBUG < INFO < WARN < ERROR)
# DEBUG mostra mais informações úteis durante o desenvolvimento
logging.level.org.springframework=DEBUG


# ================================
# ? (OPCIONAL) CONFIGURAÇÃO DO SERVIDOR
# ================================

# Porta do servidor (caso 8080 esteja ocupada, você pode mudar)
# server.port=8081
